name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the release branch and tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # mint the OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      # npm trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      # pnpm publish hands the upload to the npm CLI on the PATH.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
        working-directory: ${{ runner.temp }}
      - uses: pnpm/action-setup@v2
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Setup git user
        run: |
          git config --global user.email "camblybot.github@gmail.com"
          git config --global user.name "camblybot"
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm run release
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_GITHUB_SECRET }}
